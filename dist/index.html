<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3f5fa">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000">
  <meta name="description" content="计算器、日历、天气、单位换算与翻译，一站式轻量工具箱。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OneBox">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OneBox · 日常工具箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="64x64" media="(prefers-color-scheme: dark)" href="icons/favicon-dark-64.png?v=2.18.125">
  <link rel="icon" type="image/png" sizes="64x64" media="(prefers-color-scheme: light)" href="icons/favicon-light-64.png?v=2.18.125">
  <link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: dark)" href="apple-touch-icon-dark.png?v=2.18.125">
  <link rel="apple-touch-icon" sizes="180x180" media="(prefers-color-scheme: light)" href="apple-touch-icon.png?v=2.18.125">
  <link rel="stylesheet" href="style.css?v=2.18.125">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" id="brandLink" href="#home" aria-label="OneBox 首页"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>OneBox</span></a>
      <div class="header-actions">
        <div id="layoutNav" class="layout-nav" hidden aria-label="主导航"></div>
        <span class="connection" aria-live="polite"><i></i><span id="connectionStatus">在线</span></span>
        <button id="notifyBtn" class="icon-btn header-icon" aria-label="消息提示" aria-expanded="false"><svg class="header-line-icon bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><sup id="notificationCount" hidden>0</sup></button>
        <button id="themeBtn" class="icon-btn header-icon" aria-label="主题：跟随系统"><svg class="header-line-icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M12 2.5v2M12 19.5v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2.5 12h2M19.5 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button id="languageBtn" class="icon-btn header-icon" aria-label="语言：跟随系统"><svg class="header-line-icon language-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M3.8 9h16.4M3.8 15h16.4M12 3.5c2.2 2.3 3.4 5.1 3.4 8.5S14.2 18.2 12 20.5C9.8 18.2 8.6 15.4 8.6 12S9.8 5.8 12 3.5Z"/></svg></button>
        <button id="settingsBtn" class="icon-btn header-icon" aria-label="设置"><svg class="header-line-icon settings-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h10M18 17h2"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="16" cy="17" r="2"/></svg></button>
        <label id="languageControl" class="language-picker" hidden><span class="sr-only">语言</span><select id="languagePicker" aria-label="语言"><option value="system">系统</option><option value="zh">中文</option><option value="en">EN</option></select></label>
        <button id="installBtn" class="install" hidden>安装应用</button>
      </div>
    </header>
    <main>
      <nav id="toolNav" aria-label="工具切换"></nav>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
    <nav id="bottomNav" class="bottom-nav" aria-label="主导航"></nav>
  </div>
  <aside id="notificationPanel" class="popover notification-panel" hidden aria-label="消息提示"></aside>
  <section id="settingsDialog" class="dialog" hidden aria-label="设置"></section>
  <section id="eventDialog" class="dialog" hidden aria-label="新增日程"></section>
  <section id="githubDialog" class="dialog" hidden aria-label="GitHub 云同步"></section>
  <section id="lunarDialog" class="dialog" hidden aria-label="农历信息"></section>
  <section id="agreementDialog" class="dialog" hidden aria-label="用户协议"></section>
  <section id="recentReadingDialog" class="dialog" hidden aria-label="最近阅读"></section>
  <section id="readerDialog" class="dialog" hidden aria-label="阅读"></section>
  <section id="annotationDialog" class="dialog" hidden aria-label="添加标注"></section>
  <script src="calendar-data.js?v=2.18.125"></script>
  <script src="app.js?v=2.18.125" defer></script>
</body>
</html>
