<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#f3f5fa">
  <meta name="description" content="计算器、日历、天气、单位换算与翻译，一站式轻量工具箱。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="OneBox">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OneBox · 日常工具箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css?v=2.10.0">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#calculator" aria-label="OneBox 首页"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>OneBox</span></a>
      <div class="header-actions">
        <span class="connection" aria-live="polite"><i></i><span id="connectionStatus">在线</span></span>
        <button id="notifyBtn" class="icon-btn header-icon" aria-label="消息提示" aria-expanded="false"><svg class="header-line-icon bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><sup id="notificationCount" hidden>0</sup></button>
        <button id="themeBtn" class="icon-btn header-icon" aria-label="主题：跟随系统"><svg class="header-line-icon theme-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.5A8.5 8.5 0 0 1 8.5 4 8.5 8.5 0 1 0 20 15.5Z"/></svg></button>
        <button id="settingsBtn" class="icon-btn header-icon" aria-label="设置"><svg class="header-line-icon settings-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.5"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.8 1.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.6v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1-1.8-1.8.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.4v-2.6h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1 1.8-1.8.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.6v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.8 1.8-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1Z"/></svg></button>
        <button id="installBtn" class="install" hidden>安装应用</button>
      </div>
    </header>
    <main>
      <nav id="toolNav" aria-label="工具切换"></nav>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
    <footer>OneBox · 日常工具箱</footer>
  </div>
  <aside id="notificationPanel" class="popover notification-panel" hidden aria-label="消息提示"></aside>
  <section id="settingsDialog" class="dialog" hidden aria-label="设置"></section>
  <section id="eventDialog" class="dialog" hidden aria-label="新增日程"></section>
  <script src="calendar-data.js?v=2.10.0"></script>
  <script src="app.js?v=2.10.0" defer></script>
</body>
</html>
