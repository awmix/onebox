<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#405cf5">
  <meta name="description" content="计算器、日历、天气、单位换算与翻译，一站式轻量工具箱。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OneBox · 日常工具箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#calculator" aria-label="OneBox 首页"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>OneBox</span></a>
      <div class="header-actions">
        <span class="connection" aria-live="polite"><i></i><span id="connectionStatus">在线</span></span>
        <button id="notifyBtn" class="icon-btn header-icon" aria-label="消息提示" aria-expanded="false"><span aria-hidden="true">♢</span><sup id="notificationCount" hidden>0</sup></button>
        <button id="settingsBtn" class="icon-btn header-icon" aria-label="设置">⚙</button>
        <button id="installBtn" class="install" hidden>安装应用</button>
        <button id="themeBtn" class="icon-btn" aria-label="主题：跟随系统">◐</button>
        <label class="language-picker"><span class="sr-only">语言</span><select id="languageSelect" aria-label="选择语言"><option value="zh">中文</option><option value="en">English</option><option value="ja" disabled>日本語（预留）</option><option value="ko" disabled>한국어（预留）</option></select></label>
      </div>
    </header>
    <main>
      <nav id="toolNav" aria-label="工具切换"></nav>
      <section id="workspace" class="workspace" aria-live="polite"></section>
      <section class="hero hero-bottom" aria-labelledby="heroTitle">
        <div>
          <p class="eyebrow">FIVE TOOLS · ONE PLACE</p>
          <h1 id="heroTitle">把每天都要用的小工具，<br><em>装进一个盒子。</em></h1>
          <p id="heroSubtitle">快速、清爽、可离线。你的数据优先保存在当前设备。</p>
        </div>
        <div class="date-orbit" aria-label="今天"><strong id="heroDay">12</strong><span id="heroMonth">SEP · 2026</span></div>
      </section>
    </main>
    <footer>OneBox · <span id="footerTagline">日常工具箱 · 数据优先保存在当前设备</span></footer>
  </div>
  <aside id="notificationPanel" class="popover notification-panel" hidden aria-label="消息提示"></aside>
  <section id="settingsDialog" class="dialog" hidden aria-label="设置"></section>
  <script src="calendar-data.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
