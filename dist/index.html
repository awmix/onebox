<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#405cf5">
  <meta name="description" content="计算器、日历、天气、单位换算与翻译，一站式轻量工具箱。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OneBox">
  <meta name="mobile-web-app-capable" content="yes">
  <title>OneBox · 日常工具箱</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="shell">
    <header class="app-header">
      <a class="brand" href="#calculator" aria-label="OneBox 首页"><span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>OneBox</span></a>
      <div class="header-actions">
        <span class="connection" aria-live="polite"><i></i><span id="connectionStatus">在线</span></span>
        <button id="notifyBtn" class="icon-btn header-icon" aria-label="消息提示" aria-expanded="false"><svg class="bell-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg><sup id="notificationCount" hidden>0</sup></button>
        <button id="settingsBtn" class="icon-btn header-icon" aria-label="设置">⚙</button>
        <button id="installBtn" class="install" hidden>安装应用</button>
        <button id="themeBtn" class="icon-btn" aria-label="主题：跟随系统">◐</button>
        <label class="language-picker"><span class="sr-only">语言</span><select id="languageSelect" aria-label="选择语言"><option value="zh">中文</option><option value="en">English</option><option value="ja" disabled>日本語（预留）</option><option value="ko" disabled>한국어（预留）</option></select></label>
      </div>
    </header>
    <main>
      <nav id="toolNav" aria-label="工具切换"></nav>
      <section id="workspace" class="workspace" aria-live="polite"></section>
    </main>
    <footer>OneBox · 日常工具箱</footer>
  </div>
  <aside id="notificationPanel" class="popover notification-panel" hidden aria-label="消息提示"></aside>
  <section id="settingsDialog" class="dialog" hidden aria-label="设置"></section>
  <script src="calendar-data.js?v=2.2.0"></script>
  <script src="app.js?v=2.2.0" defer></script>
</body>
</html>
