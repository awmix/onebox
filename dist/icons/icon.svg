<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OneBox</title>
  <desc id="desc">OneBox four-cell mark in a full-bleed square.</desc>
  <style>
    .tile { fill: #ffffff; }
    .dark-dot { fill: #11131a; }
    .blue-dot { fill: #405cf5; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #171a22; }
      .dark-dot { fill: #f5f6fa; }
    }
  </style>
  <rect class="tile" x="0" y="0" width="512" height="512"/>
  <rect class="blue-dot" x="64" y="64" width="160" height="160" rx="32"/>
  <rect class="dark-dot" x="288" y="64" width="160" height="160" rx="32"/>
  <rect class="dark-dot" x="64" y="288" width="160" height="160" rx="32"/>
  <rect class="blue-dot" x="288" y="288" width="160" height="160" rx="32"/>
</svg>
