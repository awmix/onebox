<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">OneBox</title>
  <desc id="desc">OneBox four-cell mark in a rounded square.</desc>
  <style>
    .mark-bg { fill: #11131a; }
    .mark-blue { fill: #405cf5; }
    .mark-light { fill: #f5f6fa; }
    @media (prefers-color-scheme: dark) {
      .mark-bg { fill: #f5f6fa; }
      .mark-light { fill: #171a22; }
    }
  </style>
  <rect class="mark-bg" width="512" height="512" rx="142"/>
  <rect class="mark-blue" x="112" y="112" width="112" height="112" rx="24"/>
  <rect class="mark-light" x="288" y="112" width="112" height="112" rx="24"/>
  <rect class="mark-light" x="112" y="288" width="112" height="112" rx="24"/>
  <rect class="mark-blue" x="288" y="288" width="112" height="112" rx="24"/>
</svg>
